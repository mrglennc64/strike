version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: betting-framework-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_DB: ${POSTGRES_DB:-betting_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betting_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: betting-framework-cache
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: betting-framework-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-betting_user}:${POSTGRES_PASSWORD:?error}@postgres:5432/${POSTGRES_DB:-betting_db}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:?error}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      MAX_SINGLE_BET_FRACTION: 0.05
      MAX_DAILY_LOSS_FRACTION: 0.10
      MAX_KELLY_FRACTION: 0.25
      MIN_KELLY_FRACTION: 0.01
      DEBUG: "False"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: betting-framework-web
    environment:
      VITE_API_URL: ${API_URL:-http://api:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: betting-framework-network
