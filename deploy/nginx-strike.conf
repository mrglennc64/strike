# nginx site for strike.perfecthold.online
# Serves the built React frontend and reverse-proxies /api/* to the FastAPI service.
# certbot will add the TLS (443) server block automatically.
server {
    if ($host = strike.perfecthold.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name strike.perfecthold.online;

    root /var/www/strike;
    index index.html;

    # /api/slate -> http://127.0.0.1:8077/slate  (trailing slash strips the /api prefix)
    location /api/ {
        proxy_pass http://127.0.0.1:8077/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
    }

    # SPA: let React Router handle client-side routes (e.g. /app)
    location / {
        try_files $uri $uri/ /index.html;
    }


}

server {
    listen 443 ssl;
    server_name strike.perfecthold.online;

    root /var/www/strike;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/strike.perfecthold.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/strike.perfecthold.online/privkey.pem; # managed by Certbot

    # Compress the SPA bundle and API JSON (~70% smaller on the wire).
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    gzip_min_length 1024;

    # /api/slate -> http://127.0.0.1:8077/slate
    location /api/ {
        proxy_pass http://127.0.0.1:8077/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The pre-warm cron budgets 240s for a cold slate build; give user
        # requests the same headroom instead of 504ing mid-build.
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    # Hashed Vite assets never change under the same name: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry document must always revalidate, or deploys white-screen
    # behind a heuristically-cached index.html pointing at purged assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # MLB Strikeout Engine — served as its own SPA
    location /verticals/mlb {
        root /var/www/strike;
        try_files $uri $uri/ /verticals/mlb/index.html;
    }
    # SPA: let React Router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

}
