version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: betting-framework-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-betting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betting_password}
      POSTGRES_DB: ${POSTGRES_DB:-betting_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-betting_user} -d ${POSTGRES_DB:-betting_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - betting-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: betting-framework-cache
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - betting-network

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: betting-framework-api
    environment:
      # Application
      DEBUG: ${DEBUG:-False}
      APP_NAME: ${APP_NAME:-Betting Framework}

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-betting_user}:${POSTGRES_PASSWORD:-betting_password}@postgres:5432/${POSTGRES_DB:-betting_db}
      POSTGRES_USER: ${POSTGRES_USER:-betting_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-betting_password}
      POSTGRES_DB: ${POSTGRES_DB:-betting_db}

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379

      # Security
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # Risk Management
      MAX_SINGLE_BET_FRACTION: ${MAX_SINGLE_BET_FRACTION:-0.05}
      MAX_DAILY_LOSS_FRACTION: ${MAX_DAILY_LOSS_FRACTION:-0.10}
      MAX_KELLY_FRACTION: ${MAX_KELLY_FRACTION:-0.25}
      MIN_KELLY_FRACTION: ${MIN_KELLY_FRACTION:-0.01}

      # External APIs - Sports Data
      POLYMARKET_API_KEY: ${POLYMARKET_API_KEY}
      DRAFTKINGS_API_KEY: ${DRAFTKINGS_API_KEY}
      BETMGM_API_KEY: ${BETMGM_API_KEY}
      PINNACLE_API_KEY: ${PINNACLE_API_KEY}

      # External APIs - Economic Data
      FRED_API_KEY: ${FRED_API_KEY}
      YAHOO_FINANCE_API_KEY: ${YAHOO_FINANCE_API_KEY}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}

      # External APIs - Crypto/Other
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY}

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - betting-network
    volumes:
      - ./backend:/app

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: betting-framework-web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://api:8000}
      VITE_APP_NAME: ${APP_NAME:-Betting Framework}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - betting-network
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  betting-network:
    driver: bridge
    name: betting-framework-network
